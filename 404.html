<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      This portfolio moved to https://ramanakoduri.com/

      The old URL is printed on resumes and job applications already sent, so
      it has to keep working rather than 404. GitHub Pages serves static files
      only and cannot issue a 301, so this page is the substitute:

        1. meta refresh at 0 seconds, which Google treats like a permanent
           redirect when paired with the canonical below
        2. rel=canonical, so ranking signals consolidate on the new domain
        3. location.replace() for browsers that reach JS first. replace() and
           not href, so the Back button returns to wherever the visitor came
           from instead of bouncing them back into this redirect
        4. a visible link, because 1 and 3 both fail with JS off and some
           corporate proxies strip meta refresh

      404.html is a copy of this file, so any old deep link redirects too.
      Ramana_Koduri_Resume.pdf stays in the repo and is deliberately not
      redirected: applications link to it directly.
    -->
    <title>Ramana Koduri moved to ramanakoduri.com</title>
    <link rel="canonical" href="https://ramanakoduri.com/" />
    <meta http-equiv="refresh" content="0; url=https://ramanakoduri.com/" />
    <meta name="robots" content="noindex, follow" />

    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #fdfdfc;
        color: #21201c;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        font-size: 1.375rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #5f5e58;
      }
      a.go {
        display: inline-block;
        padding: 0.7rem 1.25rem;
        border-radius: 0.5rem;
        background: #a8452b;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a.go:hover {
        background: #8f3a24;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1917;
          color: #f3f2ee;
        }
        p {
          color: #a8a69e;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <h1>This portfolio has moved</h1>
      <p>
        Ramana Koduri&rsquo;s portfolio now lives at
        <strong>ramanakoduri.com</strong>. You should be redirected
        automatically.
      </p>
      <p><a class="go" href="https://ramanakoduri.com/">Go to the new site</a></p>
    </main>

    <script>
      // replace() so this page does not become a Back-button trap.
      window.location.replace("https://ramanakoduri.com/");
    </script>
  </body>
</html>
